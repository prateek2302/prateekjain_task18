<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 18 - DOM and Event Handling</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Header with initial greeting -->
    <h1 id="greeting-header">Hello</h1>

    <!-- 4 Color Boxes -->
    <div class="boxes-container">
      <div class="box" data-color="red">Red</div>
      <div class="box" data-color="blue">Blue</div>
      <div class="box" data-color="green">Green</div>
      <div class="box" data-color="yellow">Yellow</div>
    </div>

    <!-- Input Form & Greet Button -->
    <div class="input-container">
      <input type="text" id="name-input" placeholder="Ask" />
      <button id="greet-btn">Greet</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
